<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>وبسایت خانومی</title>
    <link rel="stylesheet" href="./src/master.css" />
    <link rel="stylesheet" href="./src/output.css" />
    <link rel="stylesheet" href="./styles/all.min.css" />
  </head>
  <body class="box-border font-main">
    <img
      src="https://cdn.khanoumi.com/cml/header/be/3b/be3bf88b7b64428c879ff9615199e280.gif"
      alt="ماه مرداد"
      class="h-full w-full object-cover"
    />
    <!-- header start -->
    <header>
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <img
            alt="Khanoumi Logo"
            data-sentry-element="Image"
            data-sentry-source-file="logo.tsx"
            fetchpriority="high"
            width="96"
            height="48"
            decoding="async"
            data-nimg="1"
            class="max-h-6 w-20 lg:h-12 lg:max-h-none lg:w-24 lg:max-w-none mt-8 mr-20"
            src="https://assets.khanoumi.com/4.202.0.0/_toad/images/brand/logo.svg?v=1.1"
            style="color: transparent"
          />
          <input
            class="w-100 h-10 border border-gray-400 focus:border-gray-500 focus:outline-none rounded-sm mt-8 "
            type="search"
            placeholder=" 🔍 جست و جو در کالا ها /دسته بندی ها/برند ها "
          />
        </div>
        <div class="flex items-center gap-3 ml-10 ">
            <a class="border-2 border-pink-400 px-8 py-2 text-pink-500 font-bold rounded-md cursor-pointer">ورود</a>
            <a class="border-2 border-pink-400 px-8 py-2 text-pink-500 font-bold rounded-md cursor-pointer">ثبت نام</a>
        </div>
      </div>
      <!-- part 2  -->
      <div class=" h-10 bg-gray-900 text-white mt-4">
        <nav class="flex gap-6 p-3 mr-5 cursor-pointer">
           <a> دسته بندی محصولات</a>
           <a>پیشنهاد ویژه</a>
           <a>برندها</a>
           <a>جعبه جادویی</a>
           <a>مجله خانومی</a>
        </nav>
      </div>
    </header>
    <!-- end header -->
  </body>
</html>
